const cyclingLessons=[['Helmet & visibility','Use a correctly fitted, securely fastened cycle helmet. Choose clothing that cannot catch in moving parts. Use lighting and visibility appropriate to conditions, and check your local cycling rules.'],['Bike setup & saddle height','Use a bike that fits your reach and comfort. Set the saddle so you can pedal without rocking the hips or overreaching at the bottom. A bike fitter can check individual fit; no universal saddle height suits every rider.'],['Posture & hand position','Keep hands able to reach the brakes, shoulders relaxed and elbows softly bent. Change position on longer rides where safe, and adjust fit if hands, back or neck become uncomfortable.'],['Pedaling, cadence & gearing','Start in an easy gear and aim for smooth, comfortable pedaling. Shift before steep terrain when possible, easing pedal force while shifting. Choose cadence by comfort and control rather than chasing a fixed number.'],['Braking & stopping','Identify which lever controls each brake on your bike. Practice progressive use of both brakes on a clear, traffic-free surface. Allow more stopping distance in poor conditions and avoid abrupt grabs.'],['Cornering','Look through the turn, reduce speed before entering it, and choose a line appropriate to the surface. Keep the inside pedal raised when needed to avoid ground contact. Avoid abrupt steering or braking mid-turn.'],['Slow-speed balance','Practice starts, straight-line riding and smooth stops in a clear area. Keep your gaze ahead and have an easy way to put a foot down. A qualified instructor can support new riders.'],['Maintenance check','Before riding, inspect tyre condition and pressure, test both brakes, check wheel security and inspect the chain. Repair faults before riding. Have a qualified mechanic inspect uncertain issues.'],['Aerobic endurance','Start with short, easy rides where you can converse comfortably. Extend duration gradually as you recover well. Bring water, choose a manageable route and allow easier days after demanding rides.'],['Advanced skills & tricks','Track stands, wheel lifts and jumps require distinct coaching and controlled environments. This app does not provide a trick tutorial. Use qualified supervision and protective equipment; keep practice away from traffic.']];
function cycling(){return `<div class="wrap page"><div class="split"><div>${pageHead('Cycling academy / Beyond the gym','RIDE WITH CONTROL.','From your first confident stop to a longer, steadier ride. Learn the fundamentals before you add speed.')}<button class="btn primary" data-ex="cycle">Open cycling movement guide ${icon('arrow')}</button></div><div style="position:relative">${pic(5,'male cyclist on a wooded path','cycling-image')}<span class="photo-label">AI-GENERATED REFERENCE IMAGE</span></div></div>${subnav()}<div class="grid two">${cyclingLessons.map(([t,b],i)=>`<section class="panel"><span class="eyebrow">Lesson ${String(i+1).padStart(2,'0')}</span><h3 style="margin-top:14px">${t}</h3><p>${b}</p></section>`).join('')}</div><div class="notice">Further reading: <a href="https://www.cyclinguk.org/advice" target="_blank" rel="noopener">Cycling UK advice ↗</a> · <a href="https://www.think.gov.uk/cycle-safety/" target="_blank" rel="noopener">THINK! cycle safety ↗</a>. Check traffic rules where you ride.</div></div>`}
const lessons=[['Muscles & anatomy','Muscles create force across joints; most exercises involve several muscles working together. “Core” describes a region and function, not a single muscle. Abdominal 4-, 6- and 8-pack segmentation depends on anatomy and genetics; training cannot choose the pattern.'],['Progressive overload','Keep a record of the movement, difficulty and work you perform. Once it is comfortable and controlled, change one variable such as repetitions, range or resistance. You do not need to increase the challenge every session.'],['Training consistency','Choose a small routine you can repeat. An easy session can sustain the habit, and a missed day does not require a punishment workout. Review what fit your schedule and adjust your next plan.'],['Hydration','Keep water accessible and drink regularly, with extra attention to heat and prolonged activity. Needs vary with conditions and the individual; this app does not prescribe a fixed intake.'],['Balanced nutrition','Regular, varied meals support activity and recovery. Include a range of carbohydrate, protein and fat sources plus fruit and vegetables. Young people should focus on growth, energy and enjoyment, not calorie targets or appearance pressure.'],['Sleep & rest','Make a consistent sleep routine part of training. If fatigue affects movement quality, choose an easier day. Sleep needs vary by age and circumstances; rest is a training input, not a reward.'],['Warm-up & cooldown','Start with easy movement and gradually rehearse the patterns in your session. Finish by easing the effort down. Comfortable mobility is optional; neither warm-ups nor cooldowns make an unsuitable workload safe.'],['Recovery & soreness','Give demanding muscle work time to recover. Gentle movement may feel useful, but persistent or sharp pain is not a signal to push harder. Adjust the next session to how you actually feel.'],['Growth-appropriate exercise','For children and teenagers, prioritize enjoyment, skill, varied activity and appropriate supervision. Avoid adult maximal-load prescriptions, calorie targets and appearance goals. Seek qualified coaching for complex or heavy movements.']];

function progress(){let ss=state.sessions,total=ss.reduce((s,x)=>s+x.seconds,0),days=new Set(ss.map(x=>x.day)),last=ss.at(-1);return `<div class="wrap page">${pageHead('Progress / Your personal record','THE WORK ADDS UP.','No sample achievements. No invented streaks. Just the sessions and skills you choose to log.')}<div class="row between" style="margin-bottom:25px"><span class="pill">${storageOK?'Saved in this browser':'Storage unavailable — export to keep data'}</span><button class="btn ghost" id="export-data">Export my data ↓</button></div><div class="grid four"><div class="stat"><strong>${ss.length}</strong><span>Sessions with logged sets</span></div><div class="stat"><strong>${Math.floor(total/3600)}<small>h</small> ${Math.floor(total%3600/60)}<small>m</small></strong><span>Active session time</span></div><div class="stat"><strong>${state.skills.length.toString().padStart(2,'0')}</strong><span>Self-reported skills</span></div><div class="stat"><strong>${days.size.toString().padStart(2,'0')}</strong><span>Activity days</span></div></div><div class="notice">${last?'Recovery check: your last logged session was '+new Date(last.date).toLocaleDateString()+'. Check soreness, energy and sleep before your next demanding session.':'Your progress begins with one session. Generate a workout, then confirm the sets you actually complete.'} No background notifications are scheduled.</div><div class="grid two"><section class="panel"><div class="row between"><h3>Activity</h3><div class="row"><button class="chip" data-range="7" aria-pressed="${chartRange===7}">Week</button><button class="chip" data-range="30" aria-pressed="${chartRange===30}">Month</button></div></div><p class="small">Active minutes per day, including logged-session rests.</p><div id="activity-chart"></div></section><section class="panel"><h3>${new Date().toLocaleString(undefined,{month:'long',year:'numeric'})}</h3><p class="small">Outlined days: no sessions. Lime days marked ✓: logged activity.</p>${calendar(days)}</section></div><div class="grid two" style="margin-top:24px"><section class="panel"><div class="row between"><h3>Skill milestones</h3><a href="#skills" class="btn ghost">Skill tree ↗</a></div>${state.skills.length?state.skills.map(id=>`<div class="list-link">${E(id)?.name||esc(id)} <span class="accent">✓ Self-reported</span></div>`).join(''):'<p class="small">No skills marked yet. Decide when your technique feels controlled and repeatable.</p>'}</section><section class="panel"><h3>Personal records</h3><p class="small">Most confirmed sets of each movement in a single session. These records do not infer strength or technique.</p>${records()}</section></div><section class="panel" style="margin-top:24px"><h3>Session & exercise history</h3>${ss.length?[...ss].reverse().map(s=>`<details><summary>${new Date(s.date).toLocaleDateString()} · ${esc(s.name)} · ${s.sets.length} sets</summary><p>${clockText(s.seconds)} active time · ${s.complete?'All steps confirmed':'Partial session'}</p>${s.sets.map(x=>`<p>${E(x.id)?.name||esc(x.id)} — ${esc(x.dose)}</p>`).join('')}</details>`).join(''):'<div class="empty"><h3>A fresh start.</h3><p>Complete your first set to see real progress here.</p><a class="btn primary" href="#builder" style="margin-top:20px">Build a workout ↗</a></div>'}</section><section class="panel" style="margin-top:24px"><h3>Favorites</h3><div class="row">${state.favorites.length?state.favorites.map(f=>f[0]==='g'?`<button class="btn" data-goal="${f.slice(1)}">${goals[+f.slice(1)-1]?.name||'Goal'}</button>`:`<button class="btn" data-ex="${f.slice(1)}">${E(f.slice(1))?.name||'Exercise'}</button>`).join(''):'<p class="small">Save a goal or exercise from its detail panel.</p>'}</div></section><p class="small muted" style="margin-top:22px">Local data belongs to this browser and file location. Moving the HTML, clearing browser data or using private browsing may make previous data unavailable. Export a backup before changing browsers.</p></div>`}
function calendar(days){let now=new Date(),year=now.getFullYear(),month=now.getMonth(),offset=(new Date(year,month,1).getDay()+6)%7,count=new Date(year,month+1,0).getDate();return `<div class="calendar">${['M','T','W','T','F','S','S'].map(d=>`<span class="small muted" style="text-align:center">${d}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{let day=localDay(new Date(year,month,i+1)),hit=days.has(day);return `<span class="day ${hit?'logged':''}" aria-label="${day}: ${hit?'logged session':'no session'}">${i+1}${hit?' ✓':''}</span>`}).join('')}</div>`}

e</li></ul><p class="small">Used as user-supplied design assets. No third-party photo license or redistribution rights are asserted.</p></section><section class="panel"><h3>Asset checklist & boundaries</h3><ul class="muted"><li>Before public release: confirm rights for supplied images or replace them with appropriately licensed real-athlete photography.</li><li>Obtain verified exercise demonstration photos/videos, especially for variants without an image.</li><li>Add a licensed or anatomically verified front/back anatomy asset. The current text directory is explicitly a local alternative.</li><li>Email accounts, password recovery and manual cloud save/load are integrated with Supabase and require owner setup. Automatic live sync, push reminders and individualized coaching are not included.</li></ul><p class="small">Plans are rule-based educational starting points. They are not a medical assessment or a guarantee of suitability. Statistics start at zero.</p></section></div><div class="notice">Design: the supplied Dark Performance brief, informed by the installed UI/UX Pro Max skill. Native CSS and JavaScript provide motion, icons and charts to keep the download self-contained. “Train smarter. Move stronger.” is hero copy, not an official brand slogan.</div></div>`}

 if(!data||!['sessions','skills','favorites','plans'].every(k=>Array.isArray(data[k])))throw Error('This cloud backup has an unsupported format.');
 // Reject markup and oversized payloads before any existing template renders cloud data.
 const raw=JSON.stringify(data);if(raw.length>2000000||/[<>]/.test(raw))throw Error('Backup contains unsupported content.');
 const num=n=>Number.isFinite(n)&&n>=0&&n<=10000000;
 if(!data.skills.every(x=>typeof x==='string'&&E(x))||!data.favorites.every(x=>typeof x==='string'&&(/^(g[1-9]|g[1-4][0-9]|g50)$/.test(x)||x[0]==='e'&&E(x.slice(1)))))throw Error('Invalid skill or favorite data.');
 for(const p of data.plans){if(typeof p.id!=='string'||!/^[\w-]+$/.test(p.id)||typeof p.name!=='string'||!Array.isArray(p.items)||!num(p.warm)||!num(p.cool)||!num(p.days)||typeof p.level!=='string'||typeof p.equipment!=='string')throw Error('Invalid workout backup.');for(const i of p.items)if(!E(i.id)||!Number.isInteger(i.sets)||i.sets<1||i.sets>20||!num(i.rest)||!num(i.sec)||typeof i.dose!=='string')throw Error('Invalid exercise backup.');}
 for(const s of data.sessions){if(typeof s.name!=='string'||!num(s.seconds)||!Array.isArray(s.sets)||!Number.isFinite(Date.parse(s.date))||!/^\d{4}-\d{2}-\d{2}$/.test(s.day)||!s.sets.every(x=>E(x.id)&&typeof x.dose==='string'))throw Error('Invalid session backup.');}
 return {sessions:data.sessions,skills:data.skills,favorites:data.favorites,plans:data.plans,theme:data.theme==='light'?'light':'dark'};
}
function switchAccount(user){
 if(accountUser?.id===user?.id)return;
 // Never carry one account's workout or active session into another account.
 if(player)player.paused=true;player=null;currentPlan=null;preferredGoal=null;
 accountUser=user;cloudLoaded=false;cloudVersion=null;state=freshTraining();
 try{const raw=localStorage.getItem(trainingKey());if(raw)state=validTraining(JSON.parse(raw));}catch(e){accountMessage('Saved device data could not be loaded: '+e.message)}
 $('#account-open').textContent=user?'Account':'Sign in';applyTheme();route();
}
async function initAccount(){
 if(accountClient)return accountClient;if(accountInit)return accountInit;
 if(!SUPABASE_CONFIG.url||!SUPABASE_CONFIG.publishableKey)throw Error('Setup required: the website owner must connect a Supabase project first. No account has been created.');
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_CONFIG.url))throw Error('Use your Supabase HTTPS Project URL.');
 if(SUPABASE_CONFIG.publishableKey.startsWith('sb_secret_'))throw Error('A secret key must never be used in this HTML. Use a publishable key.');
 if(location.protocol==='file:')throw Error('Open the hosted HTTPS website (or localhost) to use accounts. The downloaded file still supports local training.');
 accountInit=(async()=>{
   const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.57.4');
   accountClient=createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
   accountClient.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{switchAccount(session?.user||null);if(event==='PASSWORD_RECOVERY')showAccount('update');},0)});
   const {data,error}=await accountClient.auth.getSession();if(error)throw error;switchAccount(data.session?.user||null);return accountClient;
 })().catch(e=>{accountInit=null;throw e});return accountInit;
}
function showAccount(mode='signin'){
 if(player&&!player.finished){toast('Finish your active workout before opening account settings.');return;}
 const connected=Boolean(SUPABASE_CONFIG.url&&SUPABASE_CONFIG.publishableKey);
 const user=accountUser;
 modal('MOTIVEX / Your account',`<h2>${mode==='update'?'SET A NEW PASSWORD.':user?'YOUR WORK. WITH YOU.':mode==='signup'?'START YOUR NEXT CHAPTER.':mode==='reset'?'RESET YOUR PASSWORD.':'WELCOME BACK.'}</h2>
 ${!connected?'<div class="notice">Account setup required. Real sign-in becomes available after the owner connects a Supabase project. You can continue training locally.</div>':''}
 <p id="account-message" role="status" aria-live="polite"></p>
 ${user&&mode!=='update'?`<p>Signed in as <strong>${esc(user.email)}</strong></p><p class="small">Your account data stays separate from guest data. Cloud saves are manual: save here before leaving a device, and load on the next device. Only saved plans and logged actions are included.</p><div class="notice">Cloud saves replace the previous backup. Loading replaces this account’s device data. Export a backup from Progress first if you want to keep both versions. If another device has changed the cloud copy, a conflicting save is rejected.</div><label class="check-label"><input type="checkbox" id="cloud-confirm"> I understand that save/load replaces a complete training snapshot.</label><div class="row"><button class="btn primary" id="cloud-save">Save to cloud</button><button class="btn" id="cloud-load">Load from cloud</button><button class="btn ghost" id="account-out">Sign out</button></div><p class="small" style="margin-top:20px">Cloud data: sessions, workout times, saved plans, favorites, skill milestones and theme. Passwords are handled by Supabase Auth, never stored in your training table.</p>`:
 `<div class="row" style="margin-bottom:24px">${mode!=='update'?'<button class="chip" data-auth-mode="signin">Sign in</button><button class="chip" data-auth-mode="signup">Sign up</button>':''}</div><form id="account-form" class="stack">${mode!=='update'?'<label class="field">Email address<input id="account-email" type="email" autocomplete="email" required maxlength="254"></label>':''}${mode!=='reset'?`<label class="field">${mode==='update'?'New password':'Password'}<input id="account-password" type="password" autocomplete="${mode==='signin'?'current-password':'new-password'}" ${mode==='signin'?'':'minlength="12"'} maxlength="128" required></label>${mode==='signin'?'':'<p class="small">Use at least 12 characters. Your project may require a stronger password.</p>'}<label class="check-label"><input id="show-password" type="checkbox">Show password</label>`:''}${mode==='signup'?'<label class="check-label"><input required type="checkbox">I understand that my account email is stored by this site’s Supabase project and training data is uploaded when I choose Save to cloud.</label>':''}<button class="btn primary" type="submit" ${!connected?'disabled':''}>${mode==='signup'?'Create account':mode==='reset'?'Send reset email':mode==='update'?'Update password':'Sign in'}</button></form>${mode==='signin'?'<button class="btn ghost" data-auth-mode="reset">Forgot password?</button>':''}<p class="small" style="margin-top:20px">Email confirmation may be required before signing in. An internet connection is required for account features.</p>`}`);
 ($('#account-email')||$('#account-password')||$('#cloud-confirm'))?.focus();
 $$('[data-auth-mode]').forEach(b=>b.onclick=()=>showAccount(b.dataset.authMode));
 if($('#show-password'))$('#show-password').onchange=e=>$('#account-password').type=e.target.checked?'text':'password';
 if($('#account-form'))$('#account-form').onsubmit=async ev=>{
  ev.preventDefault();if(accountBusy)return;accountBusy=true;const form=ev.currentTarget,button=form.querySelector('[type=submit]');button.disabled=true;accountMessage('Connecting securely…');
  try{const client=await initAccount(),email=$('#account-email')?.value.trim(),password=$('#account-password')?.value,redirect=location.origin+location.pathname;let result;
   if(mode==='signup')result=await client.auth.signUp({email,password,options:{emailRedirectTo:redirect}});
   else if(mode==='reset')result=await client.auth.resetPasswordForEmail(email,{redirectTo:redirect});
   else if(mode==='update')result=await client.auth.updateUser({password});
   else result=await client.auth.signInWithPassword({email,password});
   if(result.error)throw result.error;
   if($('#account-password'))$('#account-password').value='';
   if(mode==='reset')accountMessage('If this address is eligible, a reset email has been requested. Check your inbox and spam folder.');
   else if(mode==='signup'&&!result.data.session)accountMessage('Check your email for a confirmation link if this address is eligible. Then return here to sign in.');
   else {switchAccount(result.data.session?.user||result.data.user||accountUser);showAccount();accountMessage(mode==='update'?'Password updated.':'Signed in. Load your cloud backup here, or begin with your account’s device data.');}
  }catch(e){accountMessage(e.message||'Unable to connect. Try again.')}finally{accountBusy=false;if(button.isConnected)button.disabled=false;}
 };
 if(user&&mode!=='update'){
  $('#cloud-save').onclick=()=>cloudAction('save');$('#cloud-load').onclick=()=>cloudAction('load');
  $('#account-out').onclick=async()=>{if(accountBusy)return;try{const {error}=await accountClient.auth.signOut({scope:'local'});if(error)throw error;switchAccount(null);showAccount();accountMessage('Signed out on this device. Guest training restored.');}catch(e){accountMessage(e.message)}};
 }
}
async function cloudAction(action){
 if(accountBusy)return;if(!$('#cloud-confirm').checked){accountMessage('Please acknowledge the replacement behavior above first.');return;}
 accountBusy=true;$$('#cloud-save,#cloud-load,#account-out').forEach(b=>b.disabled=true);const owner=accountUser.id;
 try{
  const client=await initAccount();accountMessage(action==='save'?'Saving to Supabase…':'Loading from Supabase…');
  const {data:auth,error:authError}=await client.auth.getUser();if(authError)throw authError;if(auth.user?.id!==owner)throw Error('Your account changed. Reopen the account panel.');
  if(action==='load'){
   const {data,error}=await client.from('motivex_training').select('payload,version,updated_at').eq('user_id',owner).maybeSingle();if(error)throw error;
   if(!data){cloudLoaded=true;cloudVersion=null;accountMessage('No cloud backup yet. You can save your account’s current training data.');return;}
   const restored=validTraining(data.payload);if(accountUser?.id!==owner)throw Error('Account changed during load.');
   state=restored;cloudVersion=data.version;cloudLoaded=true;currentPlan=null;persist();applyTheme();route();accountMessage('Cloud backup loaded from '+new Date(data.updated_at).toLocaleString()+'.');
  }else{
   if(!cloudLoaded){const {data,error}=await client.from('motivex_training').select('version').eq('user_id',owner).maybeSingle();if(error)throw error;if(data)throw Error('An existing cloud backup was found. Export your device data if needed, then Load from cloud before editing and saving.');cloudLoaded=true;cloudVersion=null;}
   const payload=validTraining(JSON.parse(JSON.stringify(state)));let result;
   if(cloudVersion===null)result=await client.from('motivex_training').insert({user_id:owner,payload,version:1}).select('version').single();
   else result=await client.from('motivex_training').update({payload,version:cloudVersion+1}).eq('user_id',owner).eq('version',cloudVersion).select('version').maybeSingle();
   if(result.error)throw result.error;if(!result.data)throw Error('A newer backup exists on another device. Export your local data, then load the latest cloud copy.');
   if(accountUser?.id!==owner)throw Error('Account changed during save.');cloudVersion=result.data.version;accountMessage('Saved to Supabase at '+new Date().toLocaleTimeString()+'. New changes remain local until your next cloud save.');
  }
 }catch(e){accountMessage('Cloud operation failed: '+(e.message||'Check your connection and database setup.'))}finally{accountBusy=false;$$('#cloud-save,#cloud-load,#account-out').forEach(b=>b.disabled=false);}
}
$('#account-open').onclick=()=>showAccount();
if(SUPABASE_CONFIG.url&&SUPABASE_CONFIG.publishableKey)initAccount().catch(e=>toast('Account connection: '+e.message));

</script></body></html>
